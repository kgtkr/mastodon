name: kgtkr-auto-update-check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Mastodon version'
        required: false

env:
  GEMINI_CLI_TRUST_WORKSPACE: "true"

jobs:
  check-and-create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - run: |
          git config --global user.name "kgtkr actions"
          git config --global user.email "actions@kgtkr.net"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/gemini-cli

      - id: detect
        run: |
          git remote add upstream https://github.com/mastodon/mastodon.git 2>/dev/null || true
          git fetch upstream --tags

          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
          else
            TARGET_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            TARGET_VERSION="${TARGET_TAG#v}"
          fi

          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT

          if git ls-remote --exit-code --heads origin "kgtkr/update/v$TARGET_VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git merge-base --is-ancestor "v$TARGET_VERSION" origin/kgtkr-master 2>/dev/null; then
            echo "Version v$TARGET_VERSION is already merged in kgtkr-master. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - id: update
        if: steps.detect.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          BRANCH_NAME="kgtkr/update/v$VERSION"

          git checkout -b "$BRANCH_NAME" origin/kgtkr-master
          ./kgtkr-update.sh "$VERSION"

          CONFLICT_FILES=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$CONFLICT_FILES" ]; then
            AGENTS_RULES=""
            [ -f ".agents/AGENTS.md" ] && AGENTS_RULES=$(cat .agents/AGENTS.md)
            PROMPT_TEMPLATE=$(cat .github/prompts/resolve-conflict.txt)

            for file in $CONFLICT_FILES; do
              PROMPT="${PROMPT_TEMPLATE//\{\{AGENTS_RULES\}\}/$AGENTS_RULES}"
              PROMPT="${PROMPT//\{\{FILE\}\}/$file}"

              cat "$file" | gemini --skip-trust -p "$PROMPT" > "$file.tmp"
              if [ -s "$file.tmp" ]; then
                mv "$file.tmp" "$file"
                git add "$file"
              fi
            done
            GIT_MERGE_AUTOEDIT=no git commit --no-edit || true
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/kgtkr-master)" ]; then
            echo "No new commits generated for $BRANCH_NAME against kgtkr-master. Skipping PR creation."
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_commits=true" >> $GITHUB_OUTPUT
          git push origin "$BRANCH_NAME"

      - if: steps.detect.outputs.skip != 'true' && steps.update.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          BRANCH_NAME="kgtkr/update/v$VERSION"

          gh pr create \
            --repo ${{ github.repository }} \
            --title "Update to Mastodon v$VERSION" \
            --body "Automated update to Mastodon v$VERSION." \
            --base kgtkr-master \
            --head "$BRANCH_NAME"
